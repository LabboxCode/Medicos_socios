name: Update Dashboard Daily
 
on:
  schedule:
    # Runs every day at 7:00 AM Mexico City time (UTC-6 = 13:00 UTC)
    - cron: '0 13 * * *'
  workflow_dispatch:  # allow manual trigger from GitHub UI
 
jobs:
  update:
    runs-on: ubuntu-latest
 
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
 
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
 
      - name: Install dependencies
        run: pip install requests
 
      - name: Run dashboard updater
        env:
          MONDAY_API_KEY: ${{ secrets.MONDAY_API_KEY }}
        run: python update_dashboard.py
 
      - name: Commit and push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Dashboard update $(date +'%Y-%m-%d')"
          git push
